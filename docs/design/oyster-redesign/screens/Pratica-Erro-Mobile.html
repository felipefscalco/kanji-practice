<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prática mobile — erro</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#0F0E0D}
.oy{--bg:#0F0E0D;--s1:#181614;--s2:#201E1B;--s3:#2A2723;--line:#34302B;--line2:#4A453E;--tx:#EFEAE0;--tx2:#B9B1A4;--tx3:#968E82;--kan:#3B54A8;--voc:#7B4A9C;--qm:#E0A93B;--qr:#EFEADF;--qw:#0B0A09;--ok:#3FB57C;--okb:#11301F;--oki:#86E0AE;--er:#E5534B;--erb:#3A1513;--eri:#FFA39B;--pri:#EFEAE0;--onpri:#141210;font-family:'Schibsted Grotesk','Zen Kaku Gothic New',system-ui,sans-serif;color:var(--tx);background:var(--bg);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.jp{font-family:'Zen Kaku Gothic New',sans-serif}
.kj{font-family:'Klee One','Zen Kaku Gothic New',serif;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 14px;border-radius:12px;border:1px solid transparent;font:600 15px/1 'Schibsted Grotesk',sans-serif;white-space:nowrap}
.btn-p{background:var(--pri);color:var(--onpri)}
.btn-s{background:var(--s3);color:var(--tx);border-color:var(--line2)}
.ib{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:transparent;border:0;color:var(--tx2)}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font:600 11.5px/1 'Schibsted Grotesk',sans-serif;letter-spacing:.06em;text-transform:uppercase}
.eyebrow{font:600 11.5px/1.2 'Schibsted Grotesk',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
</style>
<div class="oy" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 56px; box-sizing: border-box; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 8px">
<button class="ib" aria-label="Sair da sessão"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<div role="progressbar" aria-label="Progresso da sessão" aria-valuenow="8" aria-valuemin="0" aria-valuemax="20" style="flex: 1; height: 6px; border-radius: 99px; background: var(--s3); overflow: hidden"><i style="display: block; width: 40%; height: 100%; background: var(--tx); border-radius: 99px"></i></div>
<span style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 40px; text-align: right">8/20</span>
<span style="display: flex; gap: 8px; font-size: 13px; font-variant-numeric: tabular-nums; padding-right: 4px"><span style="color: var(--oki)" aria-label="6 corretas">✓6</span><span style="color: var(--eri)" aria-label="2 incorretas">✕2</span></span>
</header>

<div style="margin: 4px 16px 0; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); background: var(--s1)">
<div style="position: relative; height: 140px; background: var(--voc); color: #fff; display: flex; align-items: center; justify-content: center">
<span class="tag" style="position: absolute; top: 14px; left: 14px; background: rgba(255,255,255,.16)">Vocabulário</span>
<span class="jp" style="position: absolute; top: 16px; right: 16px; font-size: 13px; color: rgba(255,255,255,.88)">4-3 しごと</span>
<span style="font-size: 42px; font-weight: 600; margin-top: 18px">artificial</span>
</div>
<div style="height: 52px; box-sizing: border-box; padding: 0 14px; background: var(--qw); color: var(--tx); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px">
<span class="kj" aria-hidden="true" style="width: 30px; height: 30px; border-radius: 8px; background: rgba(239,234,224,.1); display: flex; align-items: center; justify-content: center">筆</span>
<strong style="font-size: 17px">Escrita</strong><span style="font-size: 14px; color: var(--tx2)">em kanji</span>
</div>
<div style="padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div role="status" style="position: relative; height: 64px; box-sizing: border-box; border-radius: 14px; background: var(--erb); border: 2px solid var(--er); display: flex; align-items: center; justify-content: center">
<span style="position: absolute; left: 10px; width: 36px; height: 36px; border-radius: 10px; background: var(--er); color: #1A0605; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" role="img" aria-label="Incorreto"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
<span class="kj" lang="ja" style="font-size: 30px; color: var(--eri); letter-spacing: .06em">人口</span>
</div>
<div style="border-radius: 14px; border: 2px solid #2B6B47; background: var(--okb); padding: 12px 14px; display: flex; align-items: center; gap: 14px">
<span class="kj" lang="ja" style="font-size: 38px; line-height: 1">人<span style="text-decoration: underline var(--ok) 3px; text-underline-offset: 7px">工</span></span>
<div style="display: flex; flex-direction: column; line-height: 1.3"><span class="eyebrow" style="color: var(--oki)">Correta</span><span class="jp" style="font-size: 16px; color: var(--tx2)">じんこう</span><span style="font-size: 14px">artificial</span></div>
</div>
<p style="margin: 0; font-size: 14px; color: var(--tx2); padding: 2px 2px 0">Você escreveu <span class="kj" lang="ja" style="color: var(--tx)">人口</span> (população). Mesma leitura: <span class="kj" lang="ja" style="color: var(--tx)">工</span> obra ≠ <span class="kj" lang="ja" style="color: var(--tx)">口</span> boca.</p>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
<button class="btn btn-s">Foi digitação</button>
<button class="btn btn-s">Detalhes</button>
</div>
<button class="btn btn-p" style="width: 100%">Continuar</button>
<p style="margin: 0; font-size: 12.5px; color: var(--tx3); text-align: center">Volta no fim desta sessão</p>
</div>
</div>
</div>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resumo da sessão — mobile</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#0F0E0D}
.oy{--bg:#0F0E0D;--s1:#181614;--s2:#201E1B;--s3:#2A2723;--line:#34302B;--line2:#4A453E;--tx:#EFEAE0;--tx2:#B9B1A4;--tx3:#968E82;--shu:#E0532F;--shuf:#C2401F;--kani:#A3B3F2;--voci:#D2AEEC;--oki:#86E0AE;--eri:#FFA39B;--pri:#EFEAE0;--onpri:#141210;font-family:'Schibsted Grotesk','Zen Kaku Gothic New',system-ui,sans-serif;color:var(--tx);background:var(--bg);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.jp{font-family:'Zen Kaku Gothic New',sans-serif}
.kj{font-family:'Klee One','Zen Kaku Gothic New',serif;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 16px;border-radius:12px;border:1px solid transparent;font:600 16px/1 'Schibsted Grotesk',sans-serif;white-space:nowrap;text-decoration:none}
.btn-p{background:var(--pri);color:var(--onpri)}
.btn-s{background:var(--s3);color:var(--tx);border-color:var(--line2)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px}
.eyebrow{font:600 11.5px/1.2 'Schibsted Grotesk',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
.st{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;color:#fff;font-family:'Klee One',serif;font-weight:600;font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--s2)}
</style>
<div class="oy" style="width: 390px; min-height: 1100px; box-sizing: border-box; padding: 40px 16px 24px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
<div class="kj" aria-hidden="true" style="width: 88px; height: 88px; border-radius: 16px; background: var(--shuf); color: #FFF6EE; display: flex; align-items: center; justify-content: center; font-size: 56px; transform: rotate(-4deg); box-shadow: inset 0 0 0 3px rgba(255,240,230,.35)">完</div>
<h1 style="margin: 0; font-size: 32px; line-height: 1.1">Sessão concluída</h1>
<p style="margin: 0; color: var(--tx2)">20 itens em 6 min</p>
</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
<div class="card" style="padding: 14px 16px"><div class="eyebrow">Precisão</div><strong style="font-size: 28px">85%</strong></div>
<div class="card" style="padding: 14px 16px"><div class="eyebrow" style="color: var(--shu)">Sequência</div><strong style="font-size: 28px">12 dias</strong></div>
<div class="card" style="padding: 14px 16px"><div class="eyebrow" style="color: var(--oki)">✓ Corretas</div><strong style="font-size: 28px">17</strong></div>
<div class="card" style="padding: 14px 16px"><div class="eyebrow" style="color: var(--eri)">✕ Reforçar</div><strong style="font-size: 28px">3</strong></div>
</div>
<section class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 17px">Subiram de estágio · 9</h2>
<div class="row"><span class="kj" lang="ja" style="font-size: 26px; color: var(--kani); width: 48px">公</span><span style="flex: 1; font-size: 14px; color: var(--tx2)">público</span><span class="st" style="background: #A9563C">芽</span><span style="color: var(--tx3)">→</span><span class="st" style="background: #C9532F">葉</span></div>
<div class="row"><span class="kj" lang="ja" style="font-size: 26px; color: var(--kani); width: 48px">毎</span><span style="flex: 1; font-size: 14px; color: var(--tx2)">cada</span><span class="st" style="background: #A9563C">芽</span><span style="color: var(--tx3)">→</span><span class="st" style="background: #C9532F">葉</span></div>
<div class="row"><span class="kj" lang="ja" style="font-size: 20px; color: var(--voci); width: 48px">映画</span><span style="flex: 1; font-size: 14px; color: var(--tx2)">filme</span><span class="st" style="background: #8A5E4E">種</span><span style="color: var(--tx3)">→</span><span class="st" style="background: #A9563C">芽</span></div>
<button class="btn" style="min-height: 44px; background: none; color: var(--tx2); font-size: 14px">Ver todos os 9</button>
</section>
<section class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 17px">Para reforçar · 3</h2>
<div class="row"><span class="kj" lang="ja" style="font-size: 20px; color: var(--voci); width: 48px">人工</span><span style="flex: 1; font-size: 14px; color: var(--tx2)">Escrita · você: <span class="kj" style="color: var(--eri)">人口</span></span></div>
<div class="row"><span class="kj" lang="ja" style="font-size: 26px; color: var(--kani); width: 48px">始</span><span style="flex: 1; font-size: 14px; color: var(--tx2)">Leitura · você: <span class="jp" style="color: var(--eri)">しゅう</span></span></div>
<div class="row"><span class="kj" lang="ja" style="font-size: 26px; color: var(--kani); width: 48px">終</span><span style="flex: 1; font-size: 14px; color: var(--tx2)">Significado · você: <span style="color: var(--eri)">começar</span></span></div>
<button class="btn btn-s" style="min-height: 48px">Revisar os 3 erros agora</button>
</section>
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: auto">
<button class="btn btn-p">Próxima sessão · 20 itens</button>
<a class="btn btn-s" href="Dashboard-Mobile.html">Voltar ao início</a>
</div>
</div>
</body>
</html>

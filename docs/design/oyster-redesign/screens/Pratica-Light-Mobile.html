<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prática mobile — tema claro</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#F4EFE5}
.oy{--bg:#F4EFE5;--s1:#FBF8F2;--s2:#EFE9DD;--s3:#E5DDCE;--line:#DCD3C3;--line2:#C3B8A5;--tx:#1A1714;--tx2:#4F483F;--tx3:#6B6358;--kan:#3B54A8;--qm:#E0A93B;--oki:#1C6E45;--eri:#A8261F;--pri:#1A1714;--onpri:#F4EFE5;font-family:'Schibsted Grotesk','Zen Kaku Gothic New',system-ui,sans-serif;color:var(--tx);background:var(--bg);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.jp{font-family:'Zen Kaku Gothic New',sans-serif}
.kj{font-family:'Klee One','Zen Kaku Gothic New',serif;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 14px;border-radius:12px;border:1px solid transparent;font:600 15px/1 'Schibsted Grotesk',sans-serif;white-space:nowrap}
.btn-p{background:var(--pri);color:var(--onpri)}
.btn-s{background:var(--s3);color:var(--tx);border-color:var(--line2)}
.btn-p[disabled]{background:transparent;color:var(--tx3);border:1px dashed var(--line2)}
.ib{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:transparent;border:0;color:var(--tx2)}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font:600 11.5px/1 'Schibsted Grotesk',sans-serif;letter-spacing:.06em;text-transform:uppercase}
.ans{width:100%;box-sizing:border-box;height:64px;border-radius:14px;background:var(--s1);border:2px solid var(--tx);color:var(--tx);font:500 22px/1 'Schibsted Grotesk',sans-serif;text-align:center;padding:0 20px}
.ans::placeholder{color:var(--tx3)}
</style>
<div class="oy" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 56px; box-sizing: border-box; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 8px">
<button class="ib" aria-label="Sair da sessão"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<div role="progressbar" aria-label="Progresso da sessão" aria-valuenow="2" aria-valuemin="0" aria-valuemax="20" style="flex: 1; height: 6px; border-radius: 99px; background: var(--s3); overflow: hidden"><i style="display: block; width: 10%; height: 100%; background: var(--tx); border-radius: 99px"></i></div>
<span style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 40px; text-align: right">2/20</span>
<span style="display: flex; gap: 8px; font-size: 13px; font-variant-numeric: tabular-nums; padding-right: 4px"><span style="color: var(--oki)" aria-label="1 correta">✓1</span><span style="color: var(--eri)" aria-label="0 incorretas">✕0</span></span>
</header>

<div style="margin: 4px 16px 0; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); background: var(--s1); box-shadow: 0 12px 32px rgba(60,45,20,.12)">
<div style="position: relative; height: 196px; background: var(--kan); color: #fff; display: flex; align-items: center; justify-content: center">
<span class="tag" style="position: absolute; top: 14px; left: 14px; background: rgba(255,255,255,.16)">Kanji</span>
<span class="jp" style="position: absolute; top: 16px; right: 16px; font-size: 13px; color: rgba(255,255,255,.88)">4-1 デート</span>
<span class="kj" lang="ja" style="font-size: 120px; line-height: 1">毎</span>
</div>
<div style="height: 52px; box-sizing: border-box; padding: 0 14px; background: var(--qm); color: #141210; display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 8px; background: rgba(20,18,16,.12); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">Aa</span>
<strong style="font-size: 17px">Significado</strong><span style="font-size: 14px; color: #3A2D10">em português</span>
</div>
<div style="padding: 14px; display: flex; flex-direction: column; gap: 10px">
<input class="ans" aria-label="Sua resposta: significado em português" placeholder="Significado em português" autocomplete="off">
<div style="display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px">
<button class="btn btn-s">Não sei</button>
<button class="btn btn-p" disabled>Verificar</button>
</div>
</div>
</div>
</div>
</body>
</html>

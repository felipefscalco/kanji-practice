<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lição — 働, passo Significado</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#0F0E0D}
.oy{--bg:#0F0E0D;--s1:#181614;--s2:#201E1B;--s3:#2A2723;--line:#34302B;--line2:#4A453E;--tx:#EFEAE0;--tx2:#B9B1A4;--tx3:#968E82;--shu:#E0532F;--shuf:#C2401F;--kan:#3B54A8;--kani:#A3B3F2;--qm:#E0A93B;--qr:#EFEADF;--pri:#EFEAE0;--onpri:#141210;font-family:'Schibsted Grotesk','Zen Kaku Gothic New',system-ui,sans-serif;color:var(--tx);background:var(--bg);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.jp{font-family:'Zen Kaku Gothic New',sans-serif}
.kj{font-family:'Klee One','Zen Kaku Gothic New',serif;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 22px;border-radius:12px;border:1px solid transparent;font:600 16px/1 'Schibsted Grotesk',sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-p{background:var(--pri);color:var(--onpri)}
.btn-s{background:var(--s3);color:var(--tx);border-color:var(--line2)}
.btn-g{background:transparent;color:var(--tx2)}
.btn[disabled]{color:var(--tx3);border:1px dashed var(--line2);background:transparent}
.btn:focus-visible,a:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--tx);outline-offset:3px}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:6px;border:1px solid currentColor;font:500 12px/1 'Schibsted Grotesk',sans-serif;opacity:.8;box-sizing:border-box}
.eyebrow{font:600 12px/1.2 'Schibsted Grotesk',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
.q{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--s1);color:var(--tx3);font-family:'Klee One',serif;font-weight:600;font-size:22px;display:inline-flex;align-items:center;justify-content:center}
.q[aria-current="step"]{background:var(--kan);border-color:var(--kan);color:#fff}
.step{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--tx2);font:600 15px/1 'Schibsted Grotesk',sans-serif;flex:1}
.step b{width:24px;height:24px;border-radius:99px;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:12.5px}
.step[aria-selected="true"]{background:var(--s2);border-color:var(--tx);color:var(--tx)}
.box{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:22px}
.sf{width:56px;height:56px;border-radius:10px;border:1px dashed var(--line2);display:flex;align-items:flex-end;justify-content:flex-end;padding:4px;box-sizing:border-box;font-size:11px;color:var(--tx3)}
</style>
<div class="oy" style="min-height: 1000px; display: flex; flex-direction: column">
<header style="height: 72px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 24px; border-bottom: 1px solid var(--line)">
<a class="btn btn-g" href="Dashboard-Desktop.html" style="min-height: 44px; padding: 0 12px; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>Sair das lições</a>
<nav aria-label="Kanji desta lição" style="margin: 0 auto; display: flex; align-items: center; gap: 8px" lang="ja">
<span class="q" aria-current="step">働</span><span class="q">作</span><span class="q">工</span><span class="q">場</span><span class="q">始</span>
</nav>
<span style="font-size: 14px; color: var(--tx2)">Lição <strong style="color: var(--tx)">1</strong> de 5</span>
</header>

<main style="flex: 1; width: 100%; max-width: 1120px; margin: 0 auto; box-sizing: border-box; padding: 40px 24px 48px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
<aside style="flex: 1 1 320px; max-width: 380px; display: flex; flex-direction: column; gap: 16px">
<div style="aspect-ratio: 1; border-radius: 24px; background: var(--kan); color: #fff; position: relative; display: flex; align-items: center; justify-content: center">
<span style="position: absolute; top: 18px; left: 18px; height: 26px; padding: 0 10px; border-radius: 99px; background: rgba(255,255,255,.16); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center">Kanji · novo</span>
<span class="jp" style="position: absolute; top: 20px; right: 20px; font-size: 14px; color: rgba(255,255,255,.88)">4-3 しごと</span>
<span class="kj" lang="ja" style="font-size: 200px; line-height: 1">働</span>
</div>
<div class="box" style="padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center"><span class="eyebrow">Ordem dos traços</span><span style="font-size: 13px; color: var(--tx2)">13 traços</span></div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<span class="sf">1</span><span class="sf">2</span><span class="sf">3</span><span class="sf">4</span><span class="sf">5</span><span class="sf">…13</span>
</div>
<div style="display: flex; gap: 8px"><button class="btn btn-s" style="min-height: 44px; flex: 1">Animar</button><button class="btn btn-g" style="min-height: 44px; border: 1px solid var(--line2)">Praticar traçado</button></div>
<span style="font-size: 12.5px; color: var(--tx3)">[Placeholder: SVG de traços via KanjiVG]</span>
</div>
</aside>

<section style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div role="tablist" aria-label="Passos da lição" style="display: flex; gap: 8px">
<button class="step" role="tab" aria-selected="true"><b>1</b>Significado</button>
<button class="step" role="tab" aria-selected="false"><b>2</b>Leitura</button>
<button class="step" role="tab" aria-selected="false"><b>3</b>Exemplos</button>
</div>

<div role="tabpanel" style="display: flex; flex-direction: column; gap: 16px">
<div class="box" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 7px; background: var(--qm); color: #141210; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700">Aa</span><span class="eyebrow">Significado</span></div>
<strong style="font-size: 44px; line-height: 1.1; letter-spacing: -.01em">trabalhar</strong>
<span style="color: var(--tx2)">EN (KANJIDIC): work</span>
</div>

<div class="box" style="display: flex; flex-direction: column; gap: 14px">
<span class="eyebrow">Componentes</span>
<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap" lang="ja">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 10px; border-radius: 14px; background: var(--s2)"><span class="kj" style="width: 52px; height: 52px; border-radius: 10px; background: var(--s3); display: flex; align-items: center; justify-content: center; font-size: 32px">亻</span><span lang="pt-BR" style="display: flex; flex-direction: column; line-height: 1.3"><strong>pessoa</strong><span style="font-size: 13px; color: var(--tx3)">radical</span></span></div>
<span style="font-size: 22px; color: var(--tx3)">+</span>
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 10px; border-radius: 14px; background: var(--s2)"><span class="kj" style="width: 52px; height: 52px; border-radius: 10px; background: var(--s3); display: flex; align-items: center; justify-content: center; font-size: 32px">動</span><span lang="pt-BR" style="display: flex; flex-direction: column; line-height: 1.3"><strong>mover</strong><span style="font-size: 13px; color: var(--tx3)">kanji N4</span></span></div>
</div>
</div>

<div class="box" style="display: flex; flex-direction: column; gap: 10px">
<label for="mn" class="eyebrow">Seu mnemônico</label>
<textarea id="mn" rows="3" placeholder="Ex.: uma história curta ligando 亻 e 動 ao significado…" style="width: 100%; box-sizing: border-box; border-radius: 12px; background: var(--s2); border: 1px solid var(--line2); color: var(--tx); font: 16px/1.5 'Schibsted Grotesk', sans-serif; padding: 14px; resize: vertical"></textarea>
<span style="font-size: 13px; color: var(--tx3)">Aparece automaticamente quando você errar este kanji na revisão.</span>
</div>
</div>

<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
<button class="btn" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Anterior<span class="kbd">←</span></button>
<button class="btn btn-p" style="margin-left: auto">Próximo: Leitura<span class="kbd">→</span></button>
</div>
</section>
</main>
</div>
</body>
</html>

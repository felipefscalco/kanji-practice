<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prática mobile — acerto</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#0F0E0D}
.oy{--bg:#0F0E0D;--s1:#181614;--s2:#201E1B;--s3:#2A2723;--line:#34302B;--line2:#4A453E;--tx:#EFEAE0;--tx2:#B9B1A4;--tx3:#968E82;--kan:#3B54A8;--voc:#7B4A9C;--qm:#E0A93B;--qr:#EFEADF;--qw:#0B0A09;--ok:#3FB57C;--okb:#11301F;--oki:#86E0AE;--er:#E5534B;--erb:#3A1513;--eri:#FFA39B;--pri:#EFEAE0;--onpri:#141210;font-family:'Schibsted Grotesk','Zen Kaku Gothic New',system-ui,sans-serif;color:var(--tx);background:var(--bg);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.jp{font-family:'Zen Kaku Gothic New',sans-serif}
.kj{font-family:'Klee One','Zen Kaku Gothic New',serif;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 14px;border-radius:12px;border:1px solid transparent;font:600 15px/1 'Schibsted Grotesk',sans-serif;white-space:nowrap}
.btn-p{background:var(--pri);color:var(--onpri)}
.btn-s{background:var(--s3);color:var(--tx);border-color:var(--line2)}
.ib{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:transparent;border:0;color:var(--tx2)}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font:600 11.5px/1 'Schibsted Grotesk',sans-serif;letter-spacing:.06em;text-transform:uppercase}
</style>
<div class="oy" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 56px; box-sizing: border-box; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 8px">
<button class="ib" aria-label="Sair da sessão"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<div role="progressbar" aria-label="Progresso da sessão" aria-valuenow="10" aria-valuemin="0" aria-valuemax="20" style="flex: 1; height: 6px; border-radius: 99px; background: var(--s3); overflow: hidden"><i style="display: block; width: 50%; height: 100%; background: var(--tx); border-radius: 99px"></i></div>
<span style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 40px; text-align: right">10/20</span>
<span style="display: flex; gap: 8px; font-size: 13px; font-variant-numeric: tabular-nums; padding-right: 4px"><span style="color: var(--oki)" aria-label="8 corretas">✓8</span><span style="color: var(--eri)" aria-label="2 incorretas">✕2</span></span>
</header>

<div style="margin: 4px 16px 0; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); background: var(--s1)">
<div style="position: relative; height: 196px; background: var(--kan); color: #fff; display: flex; align-items: center; justify-content: center">
<span class="tag" style="position: absolute; top: 14px; left: 14px; background: rgba(255,255,255,.16)">Kanji</span>
<span class="jp" style="position: absolute; top: 16px; right: 16px; font-size: 13px; color: rgba(255,255,255,.88)">4-1 デート</span>
<span class="kj" lang="ja" style="font-size: 120px; line-height: 1">公</span>
</div>
<div style="height: 52px; box-sizing: border-box; padding: 0 14px; background: var(--qm); color: #141210; display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 8px; background: rgba(20,18,16,.12); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">Aa</span>
<strong style="font-size: 17px">Significado</strong><span style="font-size: 14px; color: #3A2D10">em português</span>
</div>
<div style="padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div role="status" style="position: relative; height: 64px; box-sizing: border-box; border-radius: 14px; background: var(--okb); border: 2px solid var(--ok); display: flex; align-items: center; justify-content: center">
<span style="position: absolute; left: 10px; width: 36px; height: 36px; border-radius: 10px; background: var(--ok); color: #06180E; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-label="Correto" role="img"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
<span style="font-size: 24px; font-weight: 600; color: var(--oki)">público</span>
</div>
<div style="display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px">
<button class="btn btn-s">Detalhes</button>
<button class="btn btn-p">Continuar</button>
</div>
</div>
</div>

<div role="status" style="margin: 16px 16px 0; padding: 12px 14px; border-radius: 14px; background: var(--s2); box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 16px 40px rgba(0,0,0,.55); display: flex; align-items: center; gap: 12px">
<div style="display: flex; align-items: center; gap: 6px">
<span class="kj" lang="ja" style="width: 36px; height: 36px; border-radius: 9px; background: #A9563C; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px">芽</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--tx2)" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
<span class="kj" lang="ja" style="width: 36px; height: 36px; border-radius: 9px; background: #C9532F; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px">葉</span>
</div>
<div style="display: flex; flex-direction: column; line-height: 1.3"><strong style="font-size: 15px"><span class="kj" lang="ja">公</span> subiu para Folha</strong><span style="font-size: 13px; color: var(--tx2)">Próxima revisão em 1 semana</span></div>
</div>
</div>
</body>
</html>

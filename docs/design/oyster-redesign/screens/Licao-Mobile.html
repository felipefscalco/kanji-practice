<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lição mobile — 働, passo Leitura</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#0F0E0D}
.oy{--bg:#0F0E0D;--s1:#181614;--s2:#201E1B;--s3:#2A2723;--line:#34302B;--line2:#4A453E;--tx:#EFEAE0;--tx2:#B9B1A4;--tx3:#968E82;--kan:#3B54A8;--qr:#EFEADF;--pri:#EFEAE0;--onpri:#141210;font-family:'Schibsted Grotesk','Zen Kaku Gothic New',system-ui,sans-serif;color:var(--tx);background:var(--bg);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.jp{font-family:'Zen Kaku Gothic New',sans-serif}
.kj{font-family:'Klee One','Zen Kaku Gothic New',serif;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 16px;border-radius:12px;border:1px solid transparent;font:600 15px/1 'Schibsted Grotesk',sans-serif;white-space:nowrap}
.btn-p{background:var(--pri);color:var(--onpri)}
.btn-s{background:var(--s3);color:var(--tx);border-color:var(--line2)}
.ib{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:transparent;border:0;color:var(--tx2)}
.eyebrow{font:600 11.5px/1.2 'Schibsted Grotesk',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
.step{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border-radius:10px;border:0;background:transparent;color:var(--tx2);font:600 14px/1 'Schibsted Grotesk',sans-serif}
.step[aria-selected="true"]{background:var(--s3);color:var(--tx)}
.box{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px}
</style>
<div class="oy" style="width: 390px; height: 940px; box-sizing: border-box; position: relative; overflow: hidden">
<header style="height: 56px; box-sizing: border-box; padding: 0 12px 0 4px; display: flex; align-items: center; gap: 8px">
<button class="ib" aria-label="Sair das lições"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<div role="progressbar" aria-label="Lições" aria-valuenow="1" aria-valuemin="0" aria-valuemax="5" style="flex: 1; display: flex; gap: 4px"><i style="flex: 1; height: 6px; border-radius: 99px; background: var(--tx)"></i><i style="flex: 1; height: 6px; border-radius: 99px; background: var(--s3)"></i><i style="flex: 1; height: 6px; border-radius: 99px; background: var(--s3)"></i><i style="flex: 1; height: 6px; border-radius: 99px; background: var(--s3)"></i><i style="flex: 1; height: 6px; border-radius: 99px; background: var(--s3)"></i></div>
<span style="font-size: 14px; font-weight: 600">1/5</span>
</header>
<main style="padding: 4px 16px 120px; display: flex; flex-direction: column; gap: 14px">
<div style="height: 220px; border-radius: 20px; background: var(--kan); color: #fff; position: relative; display: flex; align-items: center; justify-content: center">
<span style="position: absolute; top: 14px; left: 14px; height: 24px; padding: 0 9px; border-radius: 99px; background: rgba(255,255,255,.16); font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center">Kanji · novo</span>
<span class="kj" lang="ja" style="font-size: 140px; line-height: 1">働</span>
<span style="position: absolute; bottom: 14px; right: 16px; font-size: 18px; font-weight: 600; color: rgba(255,255,255,.92)">trabalhar</span>
</div>
<div role="tablist" aria-label="Passos da lição" style="display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--s1); border: 1px solid var(--line)">
<button class="step" role="tab" aria-selected="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-label="visto" role="img"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Significado</button>
<button class="step" role="tab" aria-selected="true">2 · Leitura</button>
<button class="step" role="tab" aria-selected="false">3 · Exemplos</button>
</div>
<div role="tabpanel" style="display: flex; flex-direction: column; gap: 10px">
<div class="box" style="display: flex; align-items: center; gap: 14px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px"><span class="eyebrow">On'yomi · sino-japonesa</span><span class="jp" lang="ja" style="font-size: 32px; font-weight: 500; letter-spacing: .06em">どう</span></div>
<button class="btn btn-s" style="min-height: 44px; padding: 0 12px" aria-label="Ouvir どう"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>Ouvir</button>
</div>
<div class="box" style="display: flex; align-items: center; gap: 14px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px"><span class="eyebrow">Kun'yomi · japonesa</span><span class="jp" lang="ja" style="font-size: 32px; font-weight: 500; letter-spacing: .06em">はたら<span style="color: var(--tx3)">く</span></span><span style="font-size: 13px; color: var(--tx3)">em cinza: okurigana (escrito em kana)</span></div>
<button class="btn btn-s" style="min-height: 44px; padding: 0 12px" aria-label="Ouvir はたらく"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>Ouvir</button>
</div>
<div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--s2)"><span class="jp" aria-hidden="true" style="flex: none; width: 26px; height: 26px; border-radius: 7px; background: var(--qr); color: #141210; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">あ</span><span style="font-size: 14px; color: var(--tx2)">Na revisão de Leitura, qualquer leitura listada em hiragana é aceita.</span></div>
</div>
</main>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: #0F0E0D; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px">
<button class="btn btn-s"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Voltar</button>
<button class="btn btn-p">Próximo: Exemplos</button>
</div>
</div>
</body>
</html>
